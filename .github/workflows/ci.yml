name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Project-1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: Project-1/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Rebuild Native SQLite Addon
        run: npm rebuild better-sqlite3 --build-from-source

      - name: Production Dependency Audit
        run: npm audit --omit=dev

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Scan for Hardcoded Emails and UUIDs
        run: |
          echo "Checking for hardcoded UUIDs in app/, server/, and components/..."
          if grep -r -E "[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}" app/ server/ components/; then
            echo "::error::Hardcoded UUID detected in production source tree!"
            exit 1
          fi

          echo "Checking for hardcoded personal emails in app/, server/, and components/..."
          if grep -r -E -i "[a-zA-Z0-9._%+-]+@(gmail|yahoo|hotmail|outlook|icloud|proton|aol)\.[a-zA-Z]{2,}" app/ server/ components/; then
            echo "::error::Hardcoded personal email detected in production source tree!"
            exit 1
          fi

      - name: Type Check
        run: npx tsc --noEmit

      - name: Verify SQLite Native Addon
        run: |
          node -e "const Database = require('better-sqlite3'); const db = new Database('/tmp/test-verify.db'); console.log('SQLITE TEST:', db.prepare('SELECT 1 as val').get());"

      - name: Run Unit Tests
        env:
          CI: "true"
          DATABASE_MODE: sqlite
          DATABASE_SQLITE_PATH: "/tmp/markly-test.db"
          NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "dummy-anon-key-for-unit-tests"
          ADMIN_EMAIL: "admin@example.com"
        run: |
          if ! npm test -- --reporter=verbose > test-results.log 2>&1; then
            cat test-results.log
            ERR=$(tail -n 25 test-results.log | tr '\r\n' '  ')
            echo "::error title=VitestError::$ERR"
            exit 1
          fi

      - name: Build Next.js Application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "dummy-anon-key-for-unit-tests"

