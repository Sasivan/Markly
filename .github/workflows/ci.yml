name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Project-1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: Project-1/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production Dependency Audit
        run: npm audit --omit=dev

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Scan for Hardcoded Emails and UUIDs
        run: |
          echo "Checking for hardcoded UUIDs in app/, server/, and components/..."
          if grep -r -E "[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}" app/ server/ components/; then
            echo "::error::Hardcoded UUID detected in production source tree!"
            exit 1
          fi

          echo "Checking for hardcoded personal emails in app/, server/, and components/..."
          if grep -r -E -i "[a-zA-Z0-9._%+-]+@(gmail|yahoo|hotmail|outlook|icloud|proton|aol)\.[a-zA-Z]{2,}" app/ server/ components/; then
            echo "::error::Hardcoded personal email detected in production source tree!"
            exit 1
          fi

      - name: Type Check
        run: npx tsc --noEmit

      - name: Verify SQLite Native Addon
        run: |
          node -e "try { const db = require('better-sqlite3'); console.log('better-sqlite3 OK'); } catch(e) { console.error('SQLITE_FAIL:', e.message); console.log('::error title=SQLiteBindingFail::' + e.message); process.exit(1); }"

      - name: Run Unit Tests
        env:
          CI: "true"
          DATABASE_MODE: sqlite
          DATABASE_SQLITE_PATH: ":memory:"
          NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "dummy-anon-key-for-unit-tests"
          ADMIN_EMAIL: "admin@example.com"
        run: |
          for f in tests/descriptive-search.test.ts tests/ai-config.test.ts tests/scraper.test.ts tests/import-export.test.ts tests/feedback.test.ts tests/folder-copy.test.ts tests/auth.test.ts; do
            echo "======================================"
            echo "RUNNING: $f"
            echo "======================================"
            if ! npx vitest run "$f" > single-test.log 2>&1; then
              cat single-test.log
              FAIL_MSG=$(head -n 25 single-test.log | tr '\r\n' '  ')
              echo "::error title=FailedTest::$f - $FAIL_MSG"
              exit 1
            fi
            echo "$f passed successfully!"
          done

      - name: Build Next.js Application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "dummy-anon-key-for-unit-tests"

