<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Save to Markly</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #fbfbfa;
      color: #22252a;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .logo {
      width: 24px;
      height: 24px;
      background: #2383e2;
      border-radius: 6px;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 13px;
    }
    .title {
      font-size: 14px;
      font-weight: 600;
    }
    .url-box {
      font-size: 12px;
      color: #787774;
      background: #f1f1ef;
      padding: 8px 10px;
      border-radius: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 12px;
    }
    button {
      width: 100%;
      background: #2383e2;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.6;
      cursor: default;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">M</div>
    <div class="title">Markly Bookmark Manager</div>
  </div>
  <div class="url-box" id="tabUrl">Detecting tab...</div>
  <button id="saveBtn">Save Bookmark</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
