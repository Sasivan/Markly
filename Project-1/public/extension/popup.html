<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Save to Markly</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      font-size: 13px;
      color: #0f172a;
      background: #ffffff;
      padding: 16px;
    }
    @media (prefers-color-scheme: dark) {
      body {
        color: #f8fafc;
        background: #0f172a;
      }
      input, textarea, select {
        background: #1e293b !important;
        border-color: #334155 !important;
        color: #f8fafc !important;
      }
      .card-header { border-color: #334155 !important; }
      .text-muted { color: #94a3b8 !important; }
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      margin-bottom: 12px;
      border-bottom: 1px solid #e2e8f0;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 14px;
    }
    .brand-icon {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: #2563eb;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 13px;
    }
    .form-group {
      margin-bottom: 10px;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      color: #64748b;
      margin-bottom: 4px;
    }
    input[type="text"], input[type="url"], textarea, select {
      width: 100%;
      padding: 6px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus, textarea:focus, select:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 1px #2563eb;
    }
    .star-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      padding: 4px;
      border-radius: 4px;
    }
    .star-btn.active { color: #f59e0b; }
    .btn-submit {
      width: 100%;
      background: #2563eb;
      color: #ffffff;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 14px;
      transition: background 0.15s;
    }
    .btn-submit:hover { background: #1d4ed8; }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
    .status-msg {
      margin-top: 10px;
      padding: 8px;
      border-radius: 6px;
      font-size: 11px;
      text-align: center;
      display: none;
    }
    .status-success {
      display: block;
      background: #dcfce7;
      color: #166534;
      border: 1px solid #bbf7d0;
    }
    .status-error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
    .preview-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .site-favicon {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      object-fit: contain;
    }
    .footer-link {
      margin-top: 10px;
      text-align: center;
      font-size: 11px;
    }
    .footer-link a {
      color: #2563eb;
      text-decoration: none;
    }
    .footer-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card-header">
    <div class="brand">
      <div class="brand-icon">M</div>
      <span>Save to Markly</span>
    </div>
    <button type="button" id="star-btn" class="star-btn" title="Star as Favorite">★</button>
  </div>

  <form id="save-form">
    <div class="preview-row">
      <img id="favicon-preview" class="site-favicon" src="" alt="Icon" style="display:none;" />
      <div style="flex:1;">
        <input type="text" id="bm-title" placeholder="Bookmark Title" required />
      </div>
    </div>

    <div class="form-group">
      <label for="bm-url">URL</label>
      <input type="url" id="bm-url" placeholder="https://..." required />
    </div>

    <div class="form-group">
      <label for="bm-folder">Folder Collection</label>
      <select id="bm-folder">
        <option value="__UNSORTED__">Inbox (Unsorted)</option>
      </select>
    </div>

    <div class="form-group">
      <label for="bm-tags">Tags (comma separated)</label>
      <input type="text" id="bm-tags" placeholder="tech, dev, design..." />
    </div>

    <div class="form-group">
      <label for="bm-desc">Description & Notes</label>
      <textarea id="bm-desc" rows="2" placeholder="Summary or personal notes..."></textarea>
    </div>

    <button type="submit" id="save-btn" class="btn-submit">
      <span>Save Bookmark</span>
    </button>

    <button type="button" id="stash-window-btn" style="width:100%; margin-top:8px; padding:7px 12px; border-radius:6px; border:1px solid #cbd5e1; background:transparent; color:inherit; font-size:12px; font-weight:500; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px;">
      <span>📥 Stash All Tabs in Window</span>
    </button>
  </form>

  <div id="status-msg" class="status-msg"></div>

  <div class="footer-link">
    <a href="http://localhost:3000" target="_blank" id="workspace-link">Open Markly Workspace &rarr;</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
